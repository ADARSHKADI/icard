<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Registration</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{

background:#edf2f7;

}

.sticky-progress{
    position: sticky;
    top: 0;
    z-index: 9999;
    background: white;
    padding: 8px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
.container-box{

max-width:850px;

margin:30px auto;

background:#fff;

border-radius:18px;

padding:25px;

box-shadow:0 15px 35px rgba(0,0,0,.15);

}

.title{

font-size:28px;

font-weight:bold;

text-align:center;

color:#0d6efd;

margin-bottom:25px;

}

.form-label{

font-weight:600;

}

.photo-preview{

width:160px;

height:200px;

border:2px dashed #0d6efd;

margin:auto;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

border-radius:10px;

background:#fafafa;

}

.photo-preview img{

width:100%;

height:100%;

object-fit:cover;

display:none;

}

.progress{

height:8px;

margin-bottom:20px;

}

.progress-bar{

width:0%;

transition:.4s;

}


/* Mandatory field red star */
.form-label::after {
    content: " *";
    color: #dc3545;
    font-weight: 700;
    margin-left: 3px;
}

/* =========================================================
   GITHUB PAGES / MOBILE RESPONSIVE FIX
   ========================================================= */

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    overflow-x: hidden;
}

.container {
    width: 100%;
}

.form-control,
.form-select,
textarea,
input[type="file"] {
    max-width: 100%;
}

@media (max-width: 767.98px) {

    body {
        padding: 0;
        margin: 0;
    }

    .container {
        width: 100% !important;
        max-width: 100% !important;
        padding-left: 10px !important;
        padding-right: 10px !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
    }

    .container-box {
        width: 100%;
        max-width: 100%;
        margin: 12px auto;
        padding: 18px 14px;
        border-radius: 14px;
    }

    .title {
        font-size: 21px;
        line-height: 1.3;
        margin-bottom: 18px;
    }

    .row {
        margin-left: 0 !important;
        margin-right: 0 !important;
    }

    .col-md-6,
    .col-12 {
        width: 100%;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    .form-control,
    .form-select {
        width: 100%;
        min-height: 42px;
        font-size: 16px;
    }

    textarea.form-control {
        min-height: 90px;
    }

    .photo-preview {
        width: 115px;
        height: 155px;
    }

    #photo {
        width: 100%;
    }

    #submitBtn {
        width: 100%;
        max-width: 100%;
        padding-left: 15px !important;
        padding-right: 15px !important;
    }

    .sticky-progress {
        padding: 5px 0;
    }
}

/* Small phones */
@media (max-width: 380px) {

    .container-box {
        padding: 15px 11px;
    }

    .title {
        font-size: 19px;
    }

    .photo-preview {
        width: 105px;
        height: 140px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="container-box">

<div class="title">

Teacher Registration For ICard Generation

</div>

<div class="sticky-progress">
    <div class="progress" style="height:8px;">
        <div id="progressBar" class="progress-bar bg-success" style="width:0%"></div>
    </div>
</div>

<form id="teacherForm">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Employee ID (જ્ઞાન સહાયક અને માનદ વેતન કર્મચારીઓએ પોતાનો PAN Card નંબર લખવો.) 

</label>

<input
    type="text"
    id="employeeID"
    class="form-control"
    maxlength="12"
    
    required>

<small id="empStatus" class="fw-bold"></small>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Full Name (અંગ્રેજીમાં)

</label>

<input

type="text"

id="fullName"

class="form-control"

style="text-transform:uppercase"

required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Designation

</label>

<select
id="designation"
class="form-select"
required>

<option value="">Select Designation</option>

<option>Principal</option>
<option>Vice Principal</option>
<option>Assistant Teacher</option>
<option>Teacher</option>
<option>Clerk</option>
<option>Peon</option>
<option>Lab Assistant</option>
<option>Librarian</option>
<option>Accountant</option>
<option>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Mobile Number (10 અંકોમાં )

</label>

<input
type="text"
id="mobile"
class="form-control"
maxlength="10"
placeholder="10 Digit Mobile Number"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Blood Group

</label>

<select
id="bloodGroup"
class="form-select"
required>

<option value="">Select Blood Group</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Date of Birth

</label>

<input
type="text"
id="dob"
class="form-control"
placeholder="DD-MM-YYYY"
maxlength="10"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Date of Joining

</label>

<input
type="text"
id="doj"
class="form-control"
placeholder="DD-MM-YYYY"
maxlength="10"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Retire Date

</label>

<input
type="text"
id="retireDate"
class="form-control"
placeholder="DD-MM-YYYY"
maxlength="10"
required>

</div>

<div class="col-12 mb-3">

<label class="form-label">

Address (હાલનુ પૂરું સરનામું )

</label>

<textarea
id="address"
class="form-control"
rows="3"
maxlength="250"
required></textarea>

<div class="text-end">

<small>

<span id="addressCount">0</span>/250

</small>

</div>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Teacher Photo (તાજેતરનો પાસપોર્ટ સાઈઝ ફોટો)

</label>

<input
type="file"
id="photo"
class="form-control"
accept="image/*"
capture="environment">

</div>

<div class="col-md-6 mb-4">

<div class="photo-preview">

<img id="previewImage">

<span id="photoText">

Photo Preview

</span>

</div>

</div>

<div class="col-12 text-center mt-3">

<button
type="button"
class="btn btn-primary btn-lg px-5"
id="submitBtn">

<i class="fa-solid fa-floppy-disk"></i>

Save Registration

</button>

</div>

</div>

</form>

</div>

</div>



<!-- Photo Crop Modal -->
<div class="modal fade" id="cropModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Crop Teacher Photo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">

        <div style="max-height:500px;">
          <img id="cropImage" style="max-width:100%;">
        </div>

      </div>

      <div class="modal-footer">

        <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cancel
        </button>

        <button type="button"
                class="btn btn-success"
                id="cropBtn">
          Crop & Use Photo
        </button>

      </div>

    </div>
  </div>
</div>







<script>
  const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxqbOUdc-aiEN4pyfmEep-g9ND8dJDCZHidLnDPTNd_UtcUbqcfV4c_4jzHlJ6oy7D7hA/exec";

let cropper;
let cropModal;
let photoBase64 = "";





const photoInput = document.getElementById("photo");
const cropImage = document.getElementById("cropImage");
const preview = document.getElementById("previewImage");
const photoText = document.getElementById("photoText");

photoInput.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        cropImage.src = event.target.result;

        cropModal = new bootstrap.Modal(
            document.getElementById("cropModal")
        );

        cropModal.show();

    }

    reader.readAsDataURL(file);

});


document.getElementById("cropModal").addEventListener("shown.bs.modal",function(){

    if(cropper){
        cropper.destroy();
    }

    cropper = new Cropper(cropImage,{

        aspectRatio:3/4,

        viewMode:1,

        autoCropArea:1,

        movable:true,

        zoomable:true,

        scalable:false,

        rotatable:false

    });

});





document.getElementById("cropBtn").addEventListener("click", function () {

    

    if (!cropper) {
        alert("Cropper is NULL");
        return;
    }

    const canvas = cropper.getCroppedCanvas({
        width: 300,
        height: 400,
        imageSmoothingQuality: "high"
    });

    if (!canvas) {
        alert("Canvas Not Created");
        return;
    }

    photoBase64 = canvas.toDataURL("image/jpeg", 0.9);

    preview.src = photoBase64;
    preview.style.display = "block";
    photoText.style.display = "none";

    cropper.destroy();
    cropper = null;

    cropModal.hide();

    

});




//==============================
// ADDRESS COUNTER
//==============================

const address=document.getElementById("address");

const addressCount=document.getElementById("addressCount");

address.addEventListener("input",function(){

addressCount.innerHTML=this.value.length;

});





//==============================
// NAME UPPERCASE
//==============================

document.getElementById("fullName").addEventListener("input",function(){

this.value=this.value.toUpperCase();

});

//==============================
// MOBILE VALIDATION
//==============================

document.getElementById("mobile").addEventListener("input",function(){

this.value=this.value.replace(/\D/g,'');

});
    

//==============================
// PROGRESS BAR
//==============================

const form=document.getElementById("teacherForm");

form.addEventListener("input",function(){

let total=9;

let filled=0;

if(employeeID.value!="") filled++;

if(fullName.value!="") filled++;

if(designation.value!="") filled++;

if(mobile.value.length==10) filled++;

if(bloodGroup.value!="") filled++;

if(dob.value!="") filled++;

if(doj.value!="") filled++;

if(retireDate.value!="") filled++;

if(address.value!="") filled++;

document.getElementById("progressBar").style.width=(filled/total*100)+"%";

});

document.getElementById("address").addEventListener("input", function () {
    this.value = this.value.toUpperCase();
});
//==============================
// SAVE REGISTRATION
//==============================

document.getElementById("submitBtn").addEventListener("click",saveRegistration);

async function saveRegistration(){

if(employeeID.value==""){
alert("Enter Employee ID");
return;
}

if(fullName.value==""){
alert("Enter Full Name");
return;
}

if(designation.value==""){
alert("Select Designation");
return;
}

if(mobile.value.length!=10){
alert("Enter Valid Mobile Number");
return;
}

if(document.getElementById("retireDate").value.trim()==""){
alert("Enter Retire Date");
return;
}

if(photoBase64==""){
alert("Select Photo");
return;
}

submitBtn.disabled=true;

submitBtn.innerHTML="Saving...";

const data={

action:"saveTeacher",

employeeID:employeeID.value,

fullName:fullName.value,

designation:designation.value,

mobile:mobile.value,

bloodGroup:bloodGroup.value,

dob:dob.value,

doj:doj.value,

    retireDate: retireDate.value,

address:address.value,

photo:photoBase64

};

try{

const response=await fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify(data)

});

const result=await response.json();

if(result.status){

Swal.fire({
    icon: "success",
    title: "Registration Successful",
    text: "Teacher details have been saved successfully.",
    confirmButtonColor: "#198754",
    timer: 2500,
    showConfirmButton: false
});

teacherForm.reset();

preview.style.display="none";

photoText.style.display="block";

photoBase64="";

addressCount.innerHTML="0";

progressBar.style.width="0%";

}
else{

alert(result.message);

}

}
catch(e){

alert("Network Error");

}

submitBtn.disabled=false;

submitBtn.innerHTML="Save Registration";

}


//==============================
// SMART DATE FORMAT
//==============================

function autoDateFormat(input){

input.addEventListener("input",function(){

let value=this.value.replace(/\D/g,"");

if(value.length>8)
value=value.substring(0,8);

let result="";

if(value.length>=2)
result=value.substring(0,2);
else
result=value;

if(value.length>2)
result+="-"+value.substring(2,4);

if(value.length>4)
result+="-"+value.substring(4,8);

this.value=result;

});

}

const retireDate = document.getElementById("retireDate");

autoDateFormat(document.getElementById("dob"));
autoDateFormat(document.getElementById("doj"));
autoDateFormat(retireDate);

//==============================
// EMPLOYEE ID LIVE CHECK
//==============================

employeeID.addEventListener("blur",checkEmployeeIDLive);

async function checkEmployeeIDLive(){

if(employeeID.value.trim()==""){

empStatus.innerHTML="";
return;

}

try{

const response=await fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"checkEmployeeID",

employeeID:employeeID.value.trim()

})

});

const result=await response.json();

if(result.status){

empStatus.innerHTML="<span style='color:green'>✓ Employee ID Available</span>";

}
else{

empStatus.innerHTML="<span style='color:red'>✖ Employee ID Already Exists</span>";

}

}
catch(e){

empStatus.innerHTML="<span style='color:orange'>Unable to Check</span>";

}

}

</script>



</body>
</html>
